<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador Comercial Live PK 9:16 — TIK SCAN PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #07090f; color: #f8fafc; font-family: Inter, system-ui, -apple-system, sans-serif; }
    @keyframes pulseRec { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .rec-dot { animation: pulseRec 1s infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col lg:h-screen lg:overflow-hidden">

  <header class="h-14 shrink-0 border-b border-slate-800 bg-[#0d111a] px-4 lg:px-6 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-500 to-cyan-400 flex items-center justify-center font-black text-white text-sm">⚡</div>
      <div>
        <h1 class="text-sm sm:text-base font-black text-white leading-none">Gerador Comercial Live PK 9:16</h1>
        <p class="text-[11px] text-slate-400">Simula uma Batalha PK real do TikTok com seu Efeito + Chat explodindo</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-bold">← Painel</a>
      <button id="btnMute" type="button" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-bold">🔊 Som ON</button>
    </div>
  </header>

  <main class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden">
    <!-- ESQUERDA: CONTROLES -->
    <aside class="w-full lg:w-[36%] border-b lg:border-b-0 lg:border-r border-slate-800 bg-[#0d111a] p-4 space-y-4 overflow-y-auto">
      <div class="p-3.5 rounded-xl bg-emerald-950/35 border border-emerald-500/40 space-y-2.5">
        <div class="text-xs font-black text-emerald-300">1. Subir Mídias da Live</div>
        <label class="block w-full py-2 px-3 rounded-lg bg-slate-900 border border-slate-700 hover:border-cyan-400 text-xs font-bold text-center cursor-pointer">
          🖼️ Print / Foto da Live (Fundo)
          <input id="inpLiveBg" type="file" accept="image/*" class="hidden" />
        </label>
        <label class="block w-full py-2.5 px-3 rounded-lg bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 text-xs font-black text-center cursor-pointer">
          ⚔️ Subir Vídeo do Efeito (Fundo Verde/Preto)
          <input id="inpEffectVid" type="file" accept="video/*" class="hidden" />
        </label>
        <div id="vidInfo" class="text-[10px] text-slate-400 truncate">Nenhum vídeo selecionado (usando Mega Raio Azul demo).</div>
        <div class="grid grid-cols-2 gap-2">
          <select id="selKey" class="bg-[#07090f] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
            <option value="1">Remover Fundo Verde</option>
            <option value="2">Remover Fundo Preto</option>
            <option value="0">Sem Remoção</option>
          </select>
          <div>
            <div class="flex justify-between text-[10px] text-slate-400"><span>Corte Fundo</span><span id="threshTxt">0.08</span></div>
            <input id="rngThresh" type="range" min="0.01" max="0.45" step="0.01" value="0.08" class="w-full" />
          </div>
        </div>
      </div>

      <div class="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 space-y-2.5">
        <div class="text-xs font-bold uppercase text-cyan-400">2. Textos da Live &amp; Oferta</div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-[10px] text-slate-400 mb-1">Host 1 (Esq.)</label><input id="inpHost1" type="text" value="sander" class="w-full bg-[#07090f] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold" /></div>
          <div><label class="block text-[10px] text-slate-400 mb-1">Host 2 (Dir.)</label><input id="inpHost2" type="text" value="Lohan..." class="w-full bg-[#07090f] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold" /></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-[10px] text-slate-400 mb-1">Quem enviou</label><input id="inpSender" type="text" value="cigano" class="w-full bg-[#07090f] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold" /></div>
          <div><label class="block text-[10px] text-slate-400 mb-1">Nome do Efeito</label><input id="inpGiftName" type="text" value="Efeito Zeus VIP" class="w-full bg-[#07090f] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold" /></div>
        </div>
        <div><label class="block text-[10px] text-slate-400 mb-1">Texto Comercial no Final</label><input id="inpCta" type="text" value="QUER ISSO NA SUA LIVE? LINK NA BIO 👇" class="w-full bg-[#07090f] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold text-pink-400 uppercase" /></div>
      </div>

      <button id="btnRecord" type="button" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-rose-600 via-pink-600 to-amber-500 text-white font-black text-xs sm:text-sm uppercase shadow-lg flex items-center justify-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-white"></span>
        <span id="recLbl">Gravar e Baixar Comercial Live (.WEBM)</span>
      </button>
    </aside>

    <!-- DIREITA: PALCO 9:16 -->
    <section class="flex-1 flex flex-col bg-[#05070c] overflow-hidden">
      <div class="p-3 border-b border-slate-800 bg-[#0d111a]/70 flex items-center justify-between gap-2">
        <div class="flex gap-2">
          <button id="btnRestart" type="button" class="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-bold">↺ Reiniciar</button>
          <button id="btnPlayPause" type="button" class="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-bold">⏸ Pausar</button>
        </div>
        <div class="flex items-center gap-2">
          <span id="timeTxt" class="text-xs font-mono text-cyan-400">0.0s / 12.0s</span>
          <div class="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden"><div id="barFill" class="h-full bg-gradient-to-r from-rose-500 to-cyan-400 w-0"></div></div>
        </div>
      </div>

      <div class="flex-1 p-4 flex items-center justify-center overflow-hidden relative">
        <div class="relative h-[68vh] lg:h-full max-h-[76vh] aspect-[9/16] rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-black">
          <canvas id="liveCanvas" width="1080" height="1920" class="w-full h-full block"></canvas>
          <div id="recBadge" class="hidden absolute top-3 left-1/2 -translate-x-1/2 bg-black/85 border border-rose-500 px-3 py-1 rounded-full flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500 rec-dot"></span>
            <span id="recBadgeTxt" class="text-xs font-mono font-bold text-white">REC 0.0s</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <video id="effectVid" loop playsinline style="position:fixed;left:-9999px;top:0;width:16px;height:16px;opacity:0.001;pointer-events:none;"></video>

  <script>
    const canvas = document.getElementById('liveCanvas');
    const ctx = canvas.getContext('2d');
    const offC = document.createElement('canvas');
    const offCtx = offC.getContext('2d', { willReadFrequently: true });
    const effectVid = document.getElementById('effectVid');

    const state = {
      dur: 12.0, time: 0, playing: true, recording: false, muted: false, lastTs: performance.now(),
      bgImg: null, hasVid: false, keyMode: 1, thresh: 0.08, smooth: 0.14,
      host1: 'sander', host2: 'Lohan...', sender: 'cigano', giftName: 'Efeito Zeus VIP',
      cta: 'QUER ISSO NA SUA LIVE? LINK NA BIO 👇', fired: new Set(), shake: 0
    };

    // Audio Engine (Áudio original do vídeo + Trovão de impacto no Mega Raio)
    let actx = null, recBus = null, spkBus = null, dest = null, vidSrc = null, noiseBuf = null;
    function initAudio() {
      if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; actx = new AC();
      dest = actx.createMediaStreamDestination();
      recBus = actx.createGain(); recBus.gain.value = 0.95; recBus.connect(dest);
      spkBus = actx.createGain(); spkBus.gain.value = state.muted ? 0 : 0.85;
      recBus.connect(spkBus); spkBus.connect(actx.destination);
      const k = actx.createOscillator(), kg = actx.createGain(); kg.gain.value = 0.00001; k.connect(kg); kg.connect(dest); k.start();
      const sr = actx.sampleRate; noiseBuf = actx.createBuffer(1, sr * 2, sr);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (!vidSrc && state.hasVid) { vidSrc = actx.createMediaElementSource(effectVid); vidSrc.connect(recBus); }
    }
    function playThunder() {
      if (!actx || actx.state === 'suspended') return;
      const now = actx.currentTime;
      const sub = actx.createOscillator(), sg = actx.createGain();
      sub.type = 'sine'; sub.frequency.setValueAtTime(115, now); sub.frequency.exponentialRampToValueAtTime(28, now + 0.6);
      sg.gain.setValueAtTime(0.001, now); sg.gain.linearRampToValueAtTime(0.9, now + 0.015); sg.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      sub.connect(sg); sg.connect(recBus); sub.start(now); sub.stop(now + 0.85);
      const s = actx.createBufferSource(); s.buffer = noiseBuf;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, now); lp.frequency.exponentialRampToValueAtTime(140, now + 1.2);
      const g = actx.createGain(); g.gain.setValueAtTime(0.65, now); g.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
      s.connect(lp); lp.connect(g); g.connect(recBus); s.start(now); s.stop(now + 1.35);
    }

    const chatLines = [
      { u: '🔥 LINO', m: 'ATIVEM O HEART-ME 🔥', t: 0.4 },
      { u: 'sasa.tartaruga', m: 'MANO 😱', t: 1.2 },
      { u: 'Thay_salless', m: '@cigano Slc!!', t: 2.1 },
      { u: 'SHELBY', m: 'SELOKOOOO ⚡', t: 3.2 },
      { u: 'princesa jujuba', m: 'manooo que incrível', t: 4.5 },
      { u: 'Y_U_R_I ⚡', m: 'PASSADA 💥', t: 6.0 },
      { u: 'Matheus021!', m: 'crlh que foda 🔥', t: 7.5 },
      { u: 'Cruz Santos', m: 'toooppp 🚀', t: 9.0 }
    ];

    function drawChromaVideo() {
      if (!state.hasVid || effectVid.readyState < 2) return;
      const vw = effectVid.videoWidth || 720, vh = effectVid.videoHeight || 1280;
      const scale = Math.min(540 / vw, 720 / vh); // Processamento rápido 60fps para Canvas 2D
      const pw = Math.floor(vw * scale), ph = Math.floor(vh * scale);
      if (offC.width !== pw || offC.height !== ph) { offC.width = pw; offC.height = ph; }
      offCtx.drawImage(effectVid, 0, 0, pw, ph);

      if (state.keyMode !== 0) {
        const img = offCtx.getImageData(0, 0, pw, ph), d = img.data;
        const th = state.thresh * 255, sm = state.smooth * 255;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          if (state.keyMode === 1) {
            const rb = Math.max(r, b), diff = g - rb;
            if (diff > th) {
              const a = Math.max(0, 1 - (diff - th) / sm);
              d[i + 3] = a * 255;
              if (g > rb) d[i + 1] = rb + (g - rb) * 0.15;
            }
          } else {
            const luma = Math.max(r, g, b);
            if (luma < th + sm) d[i + 3] = Math.max(0, (luma - th) / sm) * 255;
          }
        }
        offCtx.putImageData(img, 0, 0);
      }

      // Desenha mantendo a proporção exata 1:1 centralizado no palco 9:16
      const asp = vw / vh, stAsp = 1080 / 1920;
      const dw = asp > stAsp ? 1080 : 1920 * asp, dh = asp > stAsp ? 1080 / asp : 1920;
      ctx.drawImage(offC, (1080 - dw) / 2, (1920 - dh) / 2, dw, dh);
    }

    function drawFrame(t, dt) {
      const w = 1080, h = 1920;
      ctx.save();
      if (state.shake > 0.5) {
        ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
        state.shake *= Math.pow(0.03, dt);
      }

      // 1. FUNDO: Print enviado pelo usuário OU Simulação Realista de Batalha PK
      if (state.bgImg) {
        const ia = state.bgImg.width / state.bgImg.height, ca = w / h;
        const bw = ia > ca ? h * ia : w, bh = ia > ca ? h : w / ia;
        ctx.drawImage(state.bgImg, (w - bw) / 2, (h - bh) / 2, bw, bh);
      } else {
        // Simulação de Batalha PK igual ao vídeo do @sander
        ctx.fillStyle = '#090b10'; ctx.fillRect(0, 0, w, h);
        // Split esquerdo (Azul/Tempestade) e direito (Preto/Rosa Neon)
        const gL = ctx.createLinearGradient(0, 300, 540, 1100);
        gL.addColorStop(0, '#071b3d'); gL.addColorStop(1, '#020611');
        ctx.fillStyle = gL; ctx.fillRect(0, 290, 538, 860);

        const gR = ctx.createLinearGradient(542, 300, 1080, 1100);
        gR.addColorStop(0, '#2c0a3a'); gR.addColorStop(1, '#09070e');
        ctx.fillStyle = gR; ctx.fillRect(542, 290, 538, 860);

        // Silhuetas estilizadas dos 2 streamers reagindo
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.arc(270, 630, 110, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(270, 930, 180, 210, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(810, 640, 105, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(810, 930, 170, 200, 0, Math.PI, Math.PI * 2); ctx.fill();

        // HUD Superior da Live PK
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, w, 290);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 34px Inter, sans-serif'; ctx.fillText(state.host1, 130, 110);
        ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 26px Inter, sans-serif'; ctx.fillText('👁️ 2.502', 880, 110);
        ctx.fillStyle = '#facc15'; ctx.font = 'bold 28px Inter, sans-serif'; ctx.fillText('⚔️ Batalha de LIVES • 4/6', 40, 185);

        // Barra PK Vermelha vs Azul subindo em tempo real!
        const score = Math.floor(104587 + t * 3500);
        const pct = Math.min(0.88, 0.55 + t * 0.03);
        ctx.fillStyle = '#e11d48'; ctx.fillRect(30, 225, 1020 * pct, 46);
        ctx.fillStyle = '#0ea5e9'; ctx.fillRect(30 + 1020 * pct, 225, 1020 * (1 - pct), 46);
        ctx.fillStyle = '#fff'; ctx.font = '900 28px Inter, sans-serif';
        ctx.fillText(score.toLocaleString('pt-BR'), 50, 258);
        ctx.textAlign = 'right'; ctx.fillText('110', 1030, 258); ctx.textAlign = 'left';

        ctx.fillStyle = '#facc15'; ctx.font = '900 30px Inter, sans-serif'; ctx.fillText('WIN ×1', 35, 345);
        ctx.fillStyle = '#cbd5e1'; ctx.textAlign = 'right'; ctx.fillText('WIN ×0', 1045, 345); ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(760, 1060, 290, 58, 28); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Inter, sans-serif'; ctx.fillText(state.host2, 815, 1098);
      }

      // 2. VÍDEO DO EFEITO COM CHROMA KEY OU MEGA RAIO AZUL DEMO
      if (state.hasVid) {
        drawChromaVideo();
      } else {
        // Demo do Mega Raio Azul de transição (igual 00:11 do vídeo do @sander!)
        if (t > 1.0 && t < 8.5) {
          if (!state.fired.has('bolt')) { state.fired.add('bolt'); playThunder(); state.shake = 26; }
          const fade = t < 1.3 ? (t - 1) / 0.3 : (t > 7.8 ? (8.5 - t) / 0.7 : 1);
          const g = ctx.createLinearGradient(120, 0, 420, 0);
          g.addColorStop(0, 'transparent'); g.addColorStop(0.5, `rgba(0,180,255,${0.95 * fade})`); g.addColorStop(1, 'transparent');
          ctx.fillStyle = g; ctx.fillRect(80, 280, 380, 920);
          ctx.fillStyle = `rgba(255,255,255,${0.95 * fade})`; ctx.fillRect(250 + (Math.random() - 0.5) * 14, 290, 40, 880);
        }
      }

      // 3. BANNER DE PRESENTE ENVIADO + CHAT SUBINDO AO VIVO
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.beginPath(); ctx.roundRect(35, 990, 510, 110, 55); ctx.fill();
      ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#facc15'; ctx.font = '900 32px Inter, sans-serif'; ctx.fillText(state.sender, 70, 1038);
      ctx.fillStyle = '#ffffff'; ctx.font = '600 28px Inter, sans-serif'; ctx.fillText(`enviou ${state.giftName} ⚡`, 70, 1078);

      // Chat explodindo na parte inferior esquerda
      const visibleChats = chatLines.filter(c => t >= c.t).slice(-5);
      visibleChats.forEach((c, idx) => {
        const y = 1230 + idx * 84;
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(35, y - 42, 680, 68, 22); ctx.fill();
        ctx.fillStyle = '#38bdf8'; ctx.font = '800 30px Inter, sans-serif'; ctx.fillText(c.u, 60, y + 2);
        ctx.fillStyle = '#ffffff'; ctx.font = '700 30px Inter, sans-serif'; ctx.fillText(c.m, 60 + ctx.measureText(c.u).width + 18, y + 2);
      });

      // 4. CTA COMERCIAL FINAL (9.0s -> 12.0s)
      if (t >= 8.5) {
        const p = Math.min(1, (t - 8.5) * 3);
        ctx.fillStyle = `rgba(5,7,13,${0.72 * p})`; ctx.fillRect(0, 1520, w, 400);
        ctx.fillStyle = '#ff1f8e'; ctx.beginPath(); ctx.roundRect(70, 1620, 940, 140, 32); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.font = '900 42px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(state.cta, w / 2, 1705);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - state.lastTs) / 1000); state.lastTs = now;
      if (state.playing || state.recording) {
        if (state.hasVid && !effectVid.paused) state.time = effectVid.currentTime;
        else { state.time += dt; if (!state.recording && state.time >= state.dur) { state.time = 0; state.fired.clear(); } }
      }
      drawFrame(Math.min(state.dur, state.time), dt);
      document.getElementById('timeTxt').textContent = `${Math.min(state.dur, state.time).toFixed(1)}s / ${state.dur.toFixed(1)}s`;
      document.getElementById('barFill').style.width = `${(Math.min(state.dur, state.time) / state.dur) * 100}%`;
    }

    // Listeners
    document.getElementById('inpLiveBg').addEventListener('change', e => {
      const f = e.target.files?.[0]; if (!f) return;
      const img = new Image(); img.onload = () => { state.bgImg = img; }; img.src = URL.createObjectURL(f);
    });
    document.getElementById('inpEffectVid').addEventListener('change', e => {
      const f = e.target.files?.[0]; if (!f) return;
      effectVid.src = URL.createObjectURL(f);
      effectVid.onloadeddata = () => {
        initAudio();
        state.hasVid = true;
        state.dur = (effectVid.duration && isFinite(effectVid.duration)) ? effectVid.duration : 10.0;
        effectVid.currentTime = 0; effectVid.play().catch(() => {});
        document.getElementById('vidInfo').textContent = `📹 ${f.name} (${state.dur.toFixed(1)}s)`;
      };
    });
    document.getElementById('selKey').addEventListener('change', e => { state.keyMode = Number(e.target.value); });
    document.getElementById('rngThresh').addEventListener('input', e => { state.thresh = parseFloat(e.target.value); document.getElementById('threshTxt').textContent = e.target.value; });
    ['Host1','Host2','Sender','GiftName','Cta'].forEach(k => {
      document.getElementById(`inp${k}`).addEventListener('input', e => { state[k.charAt(0).toLowerCase() + k.slice(1)] = e.target.value; });
    });

    document.getElementById('btnRestart').addEventListener('click', () => { initAudio(); state.time = 0; state.fired.clear(); state.playing = true; if (state.hasVid) { effectVid.currentTime = 0; effectVid.play().catch(() => {}); } });
    document.getElementById('btnPlayPause').addEventListener('click', e => { initAudio(); state.playing = !state.playing; e.target.textContent = state.playing ? '⏸ Pausar' : '▶ Reproduzir'; if (state.hasVid) { if (state.playing) effectVid.play().catch(() => {}); else effectVid.pause(); } });
    document.getElementById('btnMute').addEventListener('click', e => { initAudio(); state.muted = !state.muted; if (spkBus) spkBus.gain.setTargetAtTime(state.muted ? 0 : 0.85, actx.currentTime, 0.02); e.target.textContent = state.muted ? '🔇 Mudo' : '🔊 Som ON'; });

    document.getElementById('btnRecord').addEventListener('click', () => {
      if (state.recording) return;
      const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
      if (!mime) return alert('Use Chrome ou Edge para gravar o vídeo .WEBM.');
      initAudio();
      state.recording = true; state.playing = true; state.time = 0; state.fired.clear(); state.lastTs = performance.now();
      if (state.hasVid) { effectVid.currentTime = 0; effectVid.play().catch(() => {}); }
      const btn = document.getElementById('btnRecord'), lbl = document.getElementById('recLbl'), badge = document.getElementById('recBadge');
      btn.disabled = true; badge.classList.remove('hidden');

      const vs = canvas.captureStream(60), at = dest.stream.getAudioTracks();
      const rec = new MediaRecorder(new MediaStream([...vs.getVideoTracks(), ...at]), { mimeType: mime, videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 192_000 });
      const chunks = [];
      rec.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
      rec.onstop = () => {
        const url = URL.createObjectURL(new Blob(chunks, { type: mime })), a = document.createElement('a');
        a.href = url; a.download = `comercial-live-pk-${Date.now()}.webm`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
        state.recording = false; btn.disabled = false; lbl.textContent = 'Gravar e Baixar Comercial Live (.WEBM)'; badge.classList.add('hidden');
      };
      rec.start(100);
      const t0 = performance.now(), iv = setInterval(() => {
        const el = Math.min(state.dur, (performance.now() - t0) / 1000);
        lbl.textContent = `Gravando... (${el.toFixed(1)}s / ${state.dur.toFixed(1)}s)`;
        document.getElementById('recBadgeTxt').textContent = `REC ${el.toFixed(1)}s`;
      }, 100);
      setTimeout(() => { clearInterval(iv); if (rec.state !== 'inactive') rec.stop(); }, state.dur * 1000 + 80);
    });

    requestAnimationFrame(loop);
  </script>
</body>
